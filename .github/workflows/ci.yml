name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Test Harness (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Test Harness
        run: pytest tests/test_harness.py -v

  seguranca:
    name: Análise de segurança (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Bandit (autorizado em CONTEXT_RULES, seção 5)
        run: pip install bandit==1.9.4

      - name: Executar Bandit no código de produção
        run: bandit -r src

  docker:
    name: Build e testes no contêiner (Docker)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t sdd-task-analyzer .

      - name: Executar o Test Harness dentro do contêiner
        run: docker run --rm sdd-task-analyzer
